name: Go - Test

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "testdata/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test-reusable:
    uses: esacteksab/.github/.github/workflows/go-test.yml@92b607c2a49a19dc3bec489590a807b436a4c880  # v0.88.16
